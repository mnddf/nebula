<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEBULA · 让画面动起来</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0A0A0B;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #FFFFFF;
      height: 100vh;
      width: 100vw;
    }

    /* Canvas 背景层 */
    #bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* UI 覆盖层 */
    .ui-layer {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }
    .ui-layer > * { pointer-events: auto; }

    /* 顶部导航 */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 48px;
      background: linear-gradient(to bottom, rgba(10,10,11,0.6), transparent);
    }
    .nav-logo {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #FFFFFF;
    }
    .nav-links {
      display: flex;
      gap: 36px;
    }
    .nav-links a {
      font-size: 13px;
      color: #8A8A8F;
      text-decoration: none;
      letter-spacing: 1px;
      transition: color 0.3s ease;
    }
    .nav-links a:hover { color: #FFFFFF; }

    /* 中央内容 */
    .center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 24px;
    }
    .main-title {
      font-size: clamp(40px, 8vw, 96px);
      font-weight: 700;
      letter-spacing: 4px;
      line-height: 1.15;
      color: #FFFFFF;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeUp 0.8s 0.2s forwards ease-out;
    }
    .subtitle {
      font-size: 16px;
      color: #8A8A8F;
      letter-spacing: 1.5px;
      margin-top: 24px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s 0.5s forwards ease-out;
    }
    .cta-btn {
      margin-top: 40px;
      padding: 14px 36px;
      font-size: 14px;
      font-weight: 600;
      color: #FFFFFF;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px;
      cursor: pointer;
      letter-spacing: 1px;
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s 0.7s forwards ease-out;
    }
    .cta-btn:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.5);
      transform: translateY(-2px);
    }

    /* 底部信息 */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 48px;
      font-size: 12px;
      color: #555557;
      letter-spacing: 0.5px;
      background: linear-gradient(to top, rgba(10,10,11,0.6), transparent);
    }

    /* 淡入上浮动效 */
    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .nav { padding: 20px 24px; }
      .nav-links { gap: 20px; }
      .nav-links a { font-size: 12px; }
      .footer { padding: 16px 24px; font-size: 11px; }
      .footer .footer-right { font-size: 11px; }
    }
    @media (max-width: 480px) {
      .nav-links { gap: 14px; }
      .nav-links a { font-size: 11px; }
      .subtitle { font-size: 14px; }
      .cta-btn { padding: 12px 28px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <!-- Three.js Canvas 背景 -->
  <canvas id="bg-canvas"></canvas>

  <!-- UI 覆盖层 -->
  <div class="ui-layer">
    <!-- 顶部导航 -->
    <nav class="nav">
      <div class="nav-logo">NEBULA</div>
      <div class="nav-links">
        <a href="#">作品</a>
        <a href="#">关于</a>
        <a href="#">联系</a>
      </div>
    </nav>

    <!-- 中央内容 -->
    <div class="center">
      <h1 class="main-title">让画面<br>动起来</h1>
      <p class="subtitle">用 Three.js 构建实时三维世界，轻量、流畅、纯粹</p>
      <button class="cta-btn" id="enter-btn">进入体验 →</button>
    </div>

    <!-- 底部信息 -->
    <footer class="footer">
      <span>© 2025 NEBULA</span>
      <span class="footer-right">WebGL · Three.js</span>
    </footer>
  </div>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    // ===== WebGL 可用性检测 + 容错 =====
    function checkWebGL() {
      try {
        const c = document.createElement('canvas');
        return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
      } catch(e) { return false; }
    }

    if (!checkWebGL()) {
      // WebGL 不可用时显示提示，UI 依然可见
      const notice = document.createElement('div');
      notice.style.cssText = 'position:fixed;bottom:60px;left:50%;transform:translateX(-50%);color:#555;font-size:12px;z-index:5;';
      notice.textContent = '当前环境不支持 WebGL，请在手机或电脑浏览器中打开';
      document.body.appendChild(notice);
    } else {

    // ===== 场景初始化 =====
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0A0A0B, 0.06);

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 0, 9);

    const renderer = new THREE.WebGLRenderer({
      canvas: document.getElementById('bg-canvas'),
      antialias: true,
      alpha: true
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // ===== 生成圆形粒子纹理（让粒子是圆点而非方块） =====
    function createCircleTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      gradient.addColorStop(0, 'rgba(255,255,255,1)');
      gradient.addColorStop(0.3, 'rgba(255,255,255,0.6)');
      gradient.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(canvas);
    }
    const circleTexture = createCircleTexture();

    // ===== 粒子星云 =====
    const particleCount = 2500;
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);
    const originalPositions = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
      // 螺旋星云分布
      const radius = Math.pow(Math.random(), 0.7) * 7 + 0.3;
      const theta = Math.random() * Math.PI * 2;
      const phi = (Math.random() - 0.5) * 0.6; // 扁平化

      const x = radius * Math.cos(theta) * Math.cos(phi);
      const y = radius * Math.sin(phi) + (Math.random() - 0.5) * 0.3;
      const z = radius * Math.sin(theta) * Math.cos(phi);

      positions[i * 3]     = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = z;
      originalPositions[i * 3]     = x;
      originalPositions[i * 3 + 1] = y;
      originalPositions[i * 3 + 2] = z;

      // 冷色调：蓝 / 青 / 紫
      const c = Math.random();
      if (c < 0.4) {
        // 蓝
        colors[i * 3]     = 0.15 + Math.random() * 0.15;
        colors[i * 3 + 1] = 0.35 + Math.random() * 0.2;
        colors[i * 3 + 2] = 0.85 + Math.random() * 0.15;
      } else if (c < 0.7) {
        // 青
        colors[i * 3]     = 0.1 + Math.random() * 0.15;
        colors[i * 3 + 1] = 0.65 + Math.random() * 0.25;
        colors[i * 3 + 2] = 0.9 + Math.random() * 0.1;
      } else {
        // 紫
        colors[i * 3]     = 0.45 + Math.random() * 0.25;
        colors[i * 3 + 1] = 0.2 + Math.random() * 0.15;
        colors[i * 3 + 2] = 0.8 + Math.random() * 0.2;
      }
    }

    const particleGeo = new THREE.BufferGeometry();
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const particleMat = new THREE.PointsMaterial({
      size: 0.06,
      map: circleTexture,
      vertexColors: true,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true
    });

    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // ===== 中心低多边形几何体（线框） =====
    const coreGeo = new THREE.IcosahedronGeometry(1.6, 0);
    const coreMat = new THREE.MeshBasicMaterial({
      color: 0x4A6FA5,
      wireframe: true,
      transparent: true,
      opacity: 0.15
    });
    const core = new THREE.Mesh(coreGeo, coreMat);
    scene.add(core);

    // 内部小核
    const innerGeo = new THREE.IcosahedronGeometry(0.5, 0);
    const innerMat = new THREE.MeshBasicMaterial({
      color: 0x6B8DD6,
      wireframe: true,
      transparent: true,
      opacity: 0.3
    });
    const innerCore = new THREE.Mesh(innerGeo, innerMat);
    scene.add(innerCore);

    // ===== 鼠标 / 触控视差 =====
    let mouseX = 0, mouseY = 0;
    let targetX = 0, targetY = 0;

    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    document.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouseX = (e.touches[0].clientX / window.innerWidth - 0.5) * 2;
        mouseY = (e.touches[0].clientY / window.innerHeight - 0.5) * 2;
      }
    }, { passive: true });

    // ===== 进入体验按钮：加速动画 =====
    let boost = 0;
    document.getElementById('enter-btn').addEventListener('click', () => {
      boost = 1;
      setTimeout(() => { boost = 0; }, 2000);
    });

    // ===== 渲染循环 =====
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const t = clock.getElapsedTime();

      // 平滑视差
      targetX += (mouseX - targetX) * 0.04;
      targetY += (mouseY - targetY) * 0.04;

      // 粒子缓慢旋转
      particles.rotation.y = t * 0.04 + targetX * 0.2;
      particles.rotation.x = targetY * 0.08;

      // 粒子波动（性能优化：每隔几帧更新一次）
      const waveTime = t * 0.5;
      const pos = particleGeo.attributes.position.array;
      for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;
        const ox = originalPositions[i3];
        const oy = originalPositions[i3 + 1];
        const oz = originalPositions[i3 + 2];
        const wave = Math.sin(waveTime + ox * 0.5 + oz * 0.3) * 0.15;
        pos[i3 + 1] = oy + wave;
      }
      particleGeo.attributes.position.needsUpdate = true;

      // 中心几何体旋转
      core.rotation.x = t * 0.15;
      core.rotation.y = t * 0.1;
      innerCore.rotation.x = -t * 0.25;
      innerCore.rotation.z = t * 0.2;

      // 加速效果
      if (boost > 0) {
        boost *= 0.95;
        particles.rotation.y += boost * 0.15;
        core.rotation.y += boost * 0.2;
      }

      // 相机微动
      camera.position.x = targetX * 0.8;
      camera.position.y = -targetY * 0.5;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }

    animate();

    // ===== 窗口自适应 =====
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    } // end of WebGL check
  </script>
</body>
</html>
